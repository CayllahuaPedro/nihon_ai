[project]
name = "nihon-ai-backend"
version = "0.1.0"
description = "Nihon AI — FastAPI backend (classifier serving, level-aware tutor, mining, progress)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "anthropic>=1.0",
    "chromadb>=0.5",
    "transformers>=4.46",
    "torch>=2.5",
    "fugashi[unidic-lite]>=1.3",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff==0.17.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
